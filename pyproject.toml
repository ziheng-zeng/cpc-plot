[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-data-plotter"
version = "0.1.0"
description = "Plot CPC concentration logs and CPC FARM size-distribution data."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
